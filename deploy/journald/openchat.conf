# OpenChat journald 配额
#
# 设计律：所有进程只写 stdout（JSON lines），journald 统一收集；
#         应用不写任何日志文件，因此没有 logrotate 规则（见 deploy/logrotate.conf）。
# 审计日志不走 journald —— 它是冷库 sys.audit_log 里的 append-only 哈希链，
#         保留 5 年（合规要求），与运行日志的生命周期完全不同。
#
# 安装位置：/etc/systemd/journald.conf.d/openchat.conf
# 生效：systemctl restart systemd-journald（安装脚本会 try-restart）

[Journal]
# 磁盘总配额 200M（2C2G 单机默认；日志激增时先查循环重启）
SystemMaxUse=200M
# 单个 journal 文件上限与文件数：便于轮转与排查
SystemMaxFileSize=50M
SystemMaxFiles=8
# /run 下的易失日志（重启即失，不占磁盘）
RuntimeMaxUse=64M
# 保留期上限，双保险
MaxRetentionSec=30day
# 限速：防止错误循环把 journal 打满（与 RestartSec=1 配合观察）
RateLimitIntervalSec=30s
RateLimitBurst=10000
# 压缩：CPU 换空间，2C2G 上收益明显
Compress=yes
# 不在磁盘上保留 _BOOT_ID 之外的机器信息
Seal=no
