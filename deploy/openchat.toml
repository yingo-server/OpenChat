# OpenChat 运行配置样例（embedded 单进程）
#
# 安装位置：/etc/openchat/openchat.toml（mode 0640 root:openchat）
# 改完热生效：systemctl reload openchat（SIGHUP → 重读 policy + 白名单）
# 监听地址必须是 127.0.0.1 —— 公网入口只允许 Caddy（deploy/Caddyfile）。
#
# 注意：策略类配置（保留天数、归档/备份 cron、限流阈值）不在本文件，
#       唯一真源是 /etc/openchat/policy.json（改完 reload 即热生效）。

mode = "embedded"

# 用户层 HTTP/WS 监听（Caddy /ws 与 /api/* 反代到此）
listen = "127.0.0.1:8080"

# 管理层 AdminAPI 监听（Caddy 只对白名单 IP 反代 /api/admin/*）
admin_listen = "127.0.0.1:7780"

# Prometheus 指标监听（仅内网/本机抓取；Caddy 对外 404）
metrics_listen = "127.0.0.1:9090"

# 对外站点，用于生成绝对 URL、CORS 与 Cookie 域
public_origin = "https://chat.example.com"

# 热库（SQLite，本地 WAL）与管理库（独立 admin.db，最小权限隔离）
hot_db = "/var/lib/openchat/chatd.db"
admin_db = "/var/lib/openchat/admin.db"

# 媒体根目录（LUKS 卷挂载点，0750）
media_dir = "/var/lib/openchat/media"

# 冷库 Postgres（外部实例；sslmode=require 为底线）
cold_dsn = "postgres://openchat@db.internal:5432/openchat?sslmode=require"

# 策略真源
policy_path = "/etc/openchat/policy.json"

# 日志级别：debug | info | warn | error（stdout JSON lines → journald）
log_level = "info"

# 优雅退出预算（秒）：flusher 最后一次组提交 + 归档断点落盘
shutdown_timeout_sec = 30

# 进程看门狗（需与 systemd WatchdogSec=15 对齐，取一半）
watchdog_interval_sec = 7

# 单设备上限（用户级限流聚合用；security-spec §1.2.1）
max_devices_per_user = 3

# 上传限制（security-spec D-3/D-4）
max_upload_bytes = 52428800
daily_upload_bytes_per_user = 2147483648

# feature flags 默认值（运行期可在管理后台 /api/admin/v1/flags 热改，
# 改动经 kind 911 帧下发全端，无需重启）
[feature_flags]
video_enabled = false
e2ee = false
registration = true
readonly = false
call_enabled = false

# split 形态示例（把 mode 改为 "split" 并安装 openchat-{bridge,user,data,admin}.service）：
# mode = "split"
# [socket]
# bus = "unix:///run/openchat/bus.sock"
# user = "unix:///run/openchat/user.sock"
# data = "unix:///run/openchat/data.sock"
# admin = "unix:///run/openchat/admin.sock"
