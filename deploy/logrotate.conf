# OpenChat —— 本文件故意不包含任何轮转规则。
#
# 设计律（docs/admin-data-design.md §6）：
#   **所有进程只写 stdout（JSON lines），由 systemd-journald 统一收集。**
#   应用不写文件日志 → 没有任何文件需要 logrotate。
#
# 因此正确做法是：
#   1. 不要为 OpenChat 安装 logrotate 规则；
#   2. 用 journald 配额限制磁盘占用（deploy/journald/openchat.conf）：
#          SystemMaxUse=200M
#          SystemMaxFileSize=50M
#          SystemMaxFiles=8
#          RuntimeMaxUse=64M
#          MaxRetentionSec=30day
#   3. 需要长期留存的审计事件不在这里 —— 审计是冷库 sys.audit_log 里的
#      append-only 哈希链（保留 5 年），与运行日志生命周期完全不同。
#
# 排查命令：
#   journalctl -u openchat --since "1 hour ago" --no-pager
#   journalctl -u openchat -g 'trace_id=xxx'          # 单条消息全链路
#   journalctl --disk-usage                            # 当前占用
#   journalctl --vacuum-size=200M                      # 应急收缩
#
# 如果某个发行版的 /etc/logrotate.d 扫描要求文件存在，放一个空文件即可：
# logrotate 对「只有注释、无 stanza」的文件是 no-op，不会报错，也不会
# 产生任何轮转行为 —— 这正是我们要的。
#
# ⚠️ 一旦有人在这里添加规则，说明有组件在写文件日志，
#    那是设计违规（评审打回），应先修组件而不是加轮转。
