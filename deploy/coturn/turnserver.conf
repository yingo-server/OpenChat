# OpenChat TURN server (coturn) — ICE fallback for calls behind symmetric NAT.
# Install: apt install coturn && systemctl enable coturn
# Copy to /etc/turnserver.conf, then open firewall: 3478/udp+tcp, 49152-65535/udp.
listening-port=3478
# TLS for TURN over TCP/443 is optional; keep 3478 first.
fingerprint
lt-cred-mech
# Static credentials for the app; rotate via deploy/keygen.
user=openchat:REPLACE_WITH_TURN_PASSWORD
realm=openchat
# Do not relay to private ranges (SSRF hardening, security-spec §4.2).
no-multicast-peers
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
# Loopback peers only for self-connections.
allowed-peer-ip=127.0.0.1
min-port=49152
max-port=65535
# Log to journald via stdout, consistent with the rest of the stack.
no-stdout-log
simple-log
