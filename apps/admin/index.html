<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="color-scheme" content="light dark" />
    <title>OpenChat 管理后台</title>
    <!--
      首帧无白闪：内联阻塞脚本，早于任何 CSS 请求执行（docs/web-ui-spec.md §1.2）。
      与用户端 apps/client 使用同一份逻辑与同一个 localStorage key。
    -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('oc-theme');
          var dark = stored ? stored === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
          document.documentElement.classList.toggle('dark', dark);
          document.documentElement.dataset.theme = dark ? 'dark' : 'light';
        } catch (e) {
          /* 隐私模式下 localStorage 不可用：退回系统偏好 */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>管理后台需要启用 JavaScript。</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
