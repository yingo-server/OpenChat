<!doctype html>
<html lang="zh-CN" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#F9FAFB" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#17181C" media="(prefers-color-scheme: dark)" />
    <title>OpenChat</title>
    <!--
      §1.2 防闪白：内联阻塞脚本，必须在任何样式表/模块脚本之前执行。
      1) 读 localStorage 主题；无手动选择时跟随系统；
      2) 同步 <html class="dark"> + data-theme + color-scheme（原生滚动条/控件）；
      3) 恢复字号缩放三档，避免二次布局跳动。
    -->
    <script>
      (function () {
        try {
          var root = document.documentElement;
          var pref = localStorage.getItem('openchat.theme');
          var dark =
            pref === 'dark' ||
            (pref !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (dark) root.classList.add('dark');
          root.setAttribute('data-theme', dark ? 'dark' : 'light');
          root.style.colorScheme = dark ? 'dark' : 'light';
          var scale = localStorage.getItem('openchat.fontScale');
          if (scale === 'large') root.style.fontSize = '18px';
          else if (scale === 'xlarge') root.style.fontSize = '20px';
        } catch (e) {
          /* 隐私模式下 localStorage 不可用时静默走亮色默认 */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>OpenChat 需要启用 JavaScript。</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
