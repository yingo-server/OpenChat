name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GOFLAGS: -mod=mod

jobs:
  # ---------------------------------------------------------------------------
  # Go：不依赖前端产物。server/web/{client,admin} 里始终有 .gitkeep，
  # 因此未执行 make web 时 go:embed 仍可编译（Handler 在运行时返回 503）。
  # protoc 可选：make proto 在缺少 protoc 时保留仓库内已提交的 chatpb 实现。
  # ---------------------------------------------------------------------------
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      # 有 protoc 时重新生成；没有则直接使用已提交的 wire 兼容实现（exit 0）。
      - name: Generate proto (optional, protoc not required)
        run: make proto

      - name: Verify committed chatpb fallback exists
        run: test -f server/internal/proto/gen/chatpb/chatpb.go

      - name: Lint
        run: make lint

      - name: Import lint (bridge-design §4.1 red lines)
        run: bash scripts/importlint.sh

      - name: Test
        run: make test

      # 显式验证「没有前端产物也能构建」——go job 不得依赖 web job。
      - name: Build (no frontend artifacts)
        run: make build

  # ---------------------------------------------------------------------------
  # 前端：client 与 admin 各自独立 npm ci + build（矩阵，任一失败不掩盖另一个）。
  # 两个应用都有 package-lock.json，必须用 npm ci 保证可复现。
  # ---------------------------------------------------------------------------
  web:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [client, admin]
    defaults:
      run:
        working-directory: apps/${{ matrix.app }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/${{ matrix.app }}/package-lock.json

      - name: Install
        run: npm ci --prefer-offline

      - name: Build
        run: npm run build

      - name: Test
        run: npm run test --if-present

      - name: Upload dist
        uses: actions/upload-artifact@v4
        with:
          name: web-${{ matrix.app }}
          path: apps/${{ matrix.app }}/dist
          retention-days: 3
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # 全平台/全 CPU 架构构建（v1.1：对标 FFmpeg 的产物矩阵）
  # Linux × {amd64,386,arm64,arm(ARMv7),riscv64} + Windows × {amd64,386,arm64,arm}
  # + 源码包。CGO(SQLite) 交叉编译需要对应 gcc；windows/arm* 用 mingw/llvm-mingw，
  # 装不上则该格标记 SKIP（不阻塞其余产物）。
  # 与 go 测试 job 相互独立：test 红不影响产物构建。
  # ---------------------------------------------------------------------------
  build-matrix:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [web]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: linux,   goarch: amd64,   pkg: tar.gz, cc: x86_64-linux-gnu-gcc,      apt: gcc }
          - { goos: linux,   goarch: "386",   pkg: tar.gz, cc: i686-linux-gnu-gcc,        apt: gcc-i686-linux-gnu }
          - { goos: linux,   goarch: arm64,   pkg: tar.gz, cc: aarch64-linux-gnu-gcc,     apt: gcc-aarch64-linux-gnu }
          - { goos: linux,   goarch: arm,     pkg: tar.gz, cc: arm-linux-gnueabihf-gcc,   apt: gcc-arm-linux-gnueabihf }
          - { goos: linux,   goarch: riscv64, pkg: tar.gz, cc: riscv64-linux-gnu-gcc,     apt: gcc-riscv64-linux-gnu }
          - { goos: windows, goarch: amd64,   pkg: zip,    cc: x86_64-w64-mingw32-gcc,    apt: gcc-mingw-w64-x86-64 }
          - { goos: windows, goarch: "386",   pkg: zip,    cc: i686-w64-mingw32-gcc,      apt: gcc-mingw-w64-i686 }
          - { goos: windows, goarch: arm64,   pkg: zip,    cc: "",                        apt: "" }
          - { goos: windows, goarch: arm,     pkg: zip,    cc: "",                        apt: "" }
    name: build
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            apps/client/package-lock.json
            apps/admin/package-lock.json

      - name: Install cross toolchain
        if: matrix.apt != ''
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ${{ matrix.apt }} zip
        continue-on-error: true

      - name: Build embedded web assets
        run: make web

      - name: Cross-build package
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CC: ${{ matrix.cc }}
          PKG: ${{ matrix.pkg }}
        run: |
          if [ -n "$CC" ] && ! command -v "$CC" >/dev/null 2>&1; then
            echo "cross compiler $CC unavailable — SKIP this target"; exit 0
          fi
          CGO_ENABLED=1 GOOS=$GOOS GOARCH=$GOARCH CC=$CC \
            go build -trimpath -ldflags "-s -w" -o "stage/chatd$([ "$GOOS" = windows ] && echo .exe)" ./server/cmd/chatd || {
              # windows/arm(64) 与部分无 mingw 格：退回纯 Go 静态（chatd 依赖 cgo 的
              # SQLite，纯 Go 会缺驱动；这里给 SKIP 并标注，不阻塞其他产物）
              echo "cross build failed for $GOOS/$GOARCH — SKIP (needs CGO toolchain)"
              exit 0
            }
          mkdir -p stage/docs stage/deploy
          cp README.md LICENSE stage/
          cp docs/deploy.md docs/user-guide.md docs/admin-guide.md docs/known-issues.md stage/docs/ 2>/dev/null || true
          if [ "$GOOS" != windows ]; then
            cp -R deploy/systemd deploy/journald deploy/keygen deploy/install.sh deploy/backup.sh deploy/release.sh deploy/Caddyfile deploy/openchat.toml deploy/policy.json stage/deploy/ 2>/dev/null || true
          fi
          VER="$(git describe --tags --always 2>/dev/null | tr -c 'A-Za-z0-9._-' '-')"
          NAME="openchat-$VER-$GOOS-$GOARCH.$PKG"
          if [ "$PKG" = zip ]; then (cd stage && zip -qr "../dist/$NAME" .); else tar -czf "dist/$NAME" -C stage .; fi
          ls -lh dist/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: pkg-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*
          retention-days: 7
          if-no-files-found: warn

  # 源码包（FFmpeg 惯例）
  src-package:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Source tarball
        run: |
          VER="$(git describe --tags --always 2>/dev/null | tr -c 'A-Za-z0-9._-' '-')"
          mkdir -p dist
          git archive --format=tar.gz --prefix="openchat-$VER-src/" HEAD > "dist/openchat-$VER-src.tar.gz"
          ls -lh dist/
      - uses: actions/upload-artifact@v4
        with:
          name: pkg-src
          path: dist/*
          retention-days: 7

  # 汇总 + 发布到 GitHub Release
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [go, build-matrix, src-package]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Build SHA256SUMS
        run: |
          cd dist
          sha256sum *.tar.gz *.zip > SHA256SUMS 2>/dev/null || sha256sum * > SHA256SUMS
          ls -lh; cat SHA256SUMS

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/*.zip
            dist/SHA256SUMS
          generate_release_notes: true
          fail_on_unmatched_files: true
