name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: false

      # chatpb is committed as a wire-compatible implementation so the build
      # does not depend on protoc. When protoc is available the Makefile target
      # regenerates it from proto/chat.proto.
      - name: Generate proto (optional)
        run: make proto

      - name: Lint
        run: make lint

      - name: Test
        run: make test

      - name: Build
        run: make build

  web:
    runs-on: ubuntu-latest
    if: hashFiles('apps/client/package.json') != ''
    defaults:
      run:
        working-directory: apps/client
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/client/package-lock.json

      - run: npm ci

      - run: npm run build

      - run: npm run test --if-present
