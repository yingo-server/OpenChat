// 压测结果受安全限流（security-spec §1.2.2）约束——WS 每连接 20 msg/s、
# HTTP 由 acceptor 限流守护。压测工具刻意按限流档位错峰（125ms/条），
# 以测「在合法速率下的稳定性」而非「攻击面」。
# L4 断连语义（超限断连 + 退避）本身是被测目标之一：压力下出现断连属预期。

name: Stress

on:
  workflow_dispatch:
    inputs:
      conns:
        description: concurrent workers
        default: "64"
      duration:
        description: seconds per phase
        default: "20"
      assert:
        description: enforce thresholds (true/false)
        default: "false"
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  stress:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build chatd + stress tool
        run: |
          go build -o /tmp/chatd ./server/cmd/chatd
          go build -o /tmp/stressd ./scripts/stress

      - name: Run stress (HTTP + WS)
        env:
          CHATD_BIN: /tmp/chatd
          CONNS: ${{ github.event.inputs.conns || '64' }}
          DURATION: ${{ github.event.inputs.duration || '20' }}
          ASSERT: ${{ github.event.inputs.assert || 'false' }}
        run: |
          ARGS=""
          [ "$ASSERT" = "true" ] && ARGS="-assert"
          /tmp/stressd -conns "$CONNS" -duration "$DURATION" $ARGS -out result.json | tee stress.log
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          grep -A 20 '^endpoint' stress.log >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload result
        uses: actions/upload-artifact@v4
        with:
          name: stress-result
          path: |
            result.json
            stress.log
          retention-days: 7
