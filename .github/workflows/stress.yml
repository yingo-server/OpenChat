# 压测结果受安全限流（security-spec §1.2.2）约束。压测的目的是测带载极限：
# ladder 模式以 rate_limit_enabled=false 启动 chatd（一个开关同时放大 WS 帧
# 限流、upgrade 限流、连接上限），持续加压直到可用性跌破 70% 为止。
# 同时统计全局 RPM。

name: Stress

on:
  workflow_dispatch:
    inputs:
      ladder:
        description: ladder (comma conn counts; stops at availability < 70%)
        default: "256,512,1024,2048,4096,8192"
      duration:
        description: seconds per level
        default: "10"
  push:
    tags: ['v*']

permissions:
  contents: write

env:
  CACHE_KEY_PREFIX: stress-bin

jobs:
  stress:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # ---- 缓存构建产物（按 HEAD hash），重跑秒级进入压测 ----
      - name: Compute cache key
        id: key
        run: echo "hash=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Restore build cache
        id: cache
        uses: actions/cache@v4
        with:
          path: |
            /tmp/chatd
            /tmp/stressd
          key: ${{ env.CACHE_KEY_PREFIX }}-${{ steps.key.outputs.hash }}
          restore-keys: |
            ${{ env.CACHE_KEY_PREFIX }}-

      - name: Build chatd + stress tool
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          go build -o /tmp/chatd ./server/cmd/chatd
          go build -o /tmp/stressd ./scripts/stress

      - name: Verify binaries
        run: test -x /tmp/chatd && test -x /tmp/stressd && echo ready

      # ---- ladder 压测（自动加压到可用性 70%）----
      - name: Run ladder stress
        env:
          CHATD_BIN: /tmp/chatd
          LADDER: ${{ github.event.inputs.ladder || '256,512,1024,2048,4096,8192' }}
          DURATION: ${{ github.event.inputs.duration || '10' }}
        run: |
          /tmp/stressd -ladder "$LADDER" -duration "$DURATION" -out ladder.json | tee stress.log
          echo '## Capacity ladder' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          grep -E '^\s+[0-9]+ ' stress.log >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          # 提取极限档位写进 summary
          LAST_PASS=$(grep 'PASS' stress.log | tail -1 | awk '{print $1}')
          FIRST_FAIL=$(grep 'FAIL' stress.log | head -1 | awk '{print $1}')
          {
            echo "- **last passing level:** ${LAST_PASS:-n/a} conns"
            echo "- **first failing level:** ${FIRST_FAIL:-none reached}"
          } >> "$GITHUB_STEP_SUMMARY"

      # 结果同时落地到仓库的 bench 分支：artifact 与 job log 走 Azure blob，
      # 在某些网络环境下不可达；commit 一个分支则可通过 git 稳定取回。
      - name: Publish result to bench branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          TS=$(date -u +%Y%m%dT%H%M%SZ)
          mkdir -p bench
          cp ladder.json "bench/ladder-$TS.json"
          cp stress.log  "bench/ladder-$TS.log"
          git config user.name  "openchat-bench"
          git config user.email "bench@openchat.local"
          git checkout -q -B bench
          git add bench
          git commit -q -m "bench: ladder $TS (run ${{ github.run_id }})"
          git push -q "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" bench

      - name: Upload result
        uses: actions/upload-artifact@v4
        with:
          name: ladder-result-${{ github.run_id }}
          path: |
            ladder.json
            stress.log
          retention-days: 30
